<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 340" role="img" aria-label="Sumi, the SumIT mascot">
<style>
.ink  { stroke: #2a2522; stroke-width: 5.5; stroke-linejoin: round; stroke-linecap: round; }
    .thin { stroke: #2a2522; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .nf   { fill: none; }
    .shade { fill: #2a2522; opacity: .14; }
    .skin { fill: #f6d8b4; }

.sway   { transform-origin: 130px 330px; }
.head   { transform-origin: 130px 176px; }
.tassel { animation: tassel 1.6s ease-in-out infinite; transform-origin: 188px 66px; }
.eyes   { animation: blink 4.6s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes tassel { 0%,100% { transform: rotate(-10deg) } 50% { transform: rotate(12deg) } }
@keyframes blink  { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.12) } }

.sway { animation: jump .9s cubic-bezier(.3,.7,.4,1) infinite; }
.shadow { animation: shrink .9s cubic-bezier(.3,.7,.4,1) infinite; transform-box: fill-box; transform-origin: center; }
.pumpL { animation: pumpL .45s ease-in-out infinite alternate; transform-origin: 100px 194px; }
.pumpR { animation: pumpR .45s ease-in-out infinite alternate; transform-origin: 160px 194px; }
.c { animation: fall 1.8s linear infinite; transform-box: fill-box; transform-origin: center; }
.c:nth-child(2n) { animation-duration: 2.3s; } .c:nth-child(3n) { animation-delay: -.8s; } .c:nth-child(4n) { animation-delay: -1.4s; }
@keyframes jump { 0%,100% { transform: translateY(0) scaleY(.97) } 45% { transform: translateY(-18px) scaleY(1.02) } }
@keyframes shrink { 0%,100% { transform: scaleX(1); opacity: .18 } 45% { transform: scaleX(.75); opacity: .1 } }
@keyframes pumpL { from { transform: rotate(4deg) } to { transform: rotate(-6deg) } }
@keyframes pumpR { from { transform: rotate(-4deg) } to { transform: rotate(6deg) } }
@keyframes fall { from { transform: translateY(-40px) rotate(0) } to { transform: translateY(340px) rotate(540deg) } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<defs>
    <!-- old-print grain over the colours -->
    <filter id="paper" filterUnits="userSpaceOnUse" x="0" y="0" width="260" height="340">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .17  0 0 0 0 .14  0 0 0 0 .12  0 0 0 1.3 -.86" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="grain"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grain"/></feMerge>
    </filter>
    <clipPath id="headClip"><path d="M78 112 Q78 54 130 54 Q182 54 182 114 Q182 150 160 166 Q130 182 100 166 Q78 150 78 112 Z"/></clipPath>
    <clipPath id="gownClip"><path d="M96 182 Q86 226 84 276 Q130 286 176 276 Q174 226 164 182 Z"/></clipPath>
  </defs>
<ellipse class="shadow" cx="130" cy="330" rx="74" ry="8" fill="#2a2522" opacity=".18"/><g><rect class="c" x="20" y="0" width="7" height="11" rx="1.5" fill="#e6bd64" stroke="#2a2522" stroke-width="1.5"/><rect class="c" x="60" y="-30" width="7" height="11" rx="1.5" fill="#cc6358" stroke="#2a2522" stroke-width="1.5"/><rect class="c" x="98" y="-10" width="7" height="11" rx="1.5" fill="#7a9cc8" stroke="#2a2522" stroke-width="1.5"/><rect class="c" x="140" y="-40" width="7" height="11" rx="1.5" fill="#e6bd64" stroke="#2a2522" stroke-width="1.5"/><rect class="c" x="176" y="-5" width="7" height="11" rx="1.5" fill="#cc6358" stroke="#2a2522" stroke-width="1.5"/><rect class="c" x="214" y="-25" width="7" height="11" rx="1.5" fill="#7a9cc8" stroke="#2a2522" stroke-width="1.5"/><rect class="c" x="238" y="10" width="7" height="11" rx="1.5" fill="#e6bd64" stroke="#2a2522" stroke-width="1.5"/><rect class="c" x="40" y="-60" width="7" height="11" rx="1.5" fill="#7a9cc8" stroke="#2a2522" stroke-width="1.5"/><rect class="c" x="120" y="-70" width="7" height="11" rx="1.5" fill="#cc6358" stroke="#2a2522" stroke-width="1.5"/><rect class="c" x="196" y="-60" width="7" height="11" rx="1.5" fill="#e6bd64" stroke="#2a2522" stroke-width="1.5"/></g><g class="sway" filter="url(#paper)">
<!-- trousers, one leg cocked out -->
    <path class="ink" d="M110 262 L106 316 L126 316 L130 264 Z" fill="#4f5361"/>
    <path class="ink" d="M130 264 L146 313 L166 309 L152 262 Z" fill="#4f5361"/>
    <path class="shade" d="M120 266 L118 314 L125 314 L129 266 Z"/>
    <path class="shade" d="M146 266 L158 311 L164 310 L151 265 Z"/>
    <!-- two-tone shoes -->
    <path class="ink" d="M88 328 Q88 313 106 312 L126 312 Q132 320 129 328 Z" fill="#f0e6cf"/>
    <path class="ink" d="M88 328 Q88 314 102 313 L106 328 Z" fill="#2a2522" stroke-width="3.5"/>
    <path class="ink" d="M143 325 Q140 315 146 310 L164 306 Q186 305 188 320 L188 323 Z" fill="#f0e6cf"/>
    <path class="ink" d="M173 306 Q188 306 188 321 L179 323 Z" fill="#2a2522" stroke-width="3.5"/>
    <path d="M110 318 Q116 316 122 318 M152 314 Q158 311 164 312" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".8"/>

    <!-- the gown, cut slim and knee-length -->
    <path class="ink" d="M96 182 Q86 226 84 276 Q130 286 176 276 Q174 226 164 182 Z" fill="#5c80b0"/>
    <g clip-path="url(#gownClip)">
      <path class="shade" d="M150 180 L180 180 L180 290 L156 290 Q160 230 150 180 Z"/>
    </g>
    <!-- pinstripe suit, shirt and tie -->
    <path class="ink" d="M110 178 L150 178 Q156 220 156 268 Q130 274 104 268 Q104 220 110 178 Z" fill="#5a5f6e"/>
    <path d="M116 206 L114 266 M123 214 L122 270 M137 214 L138 270 M144 206 L146 266" stroke="#7a8094" stroke-width="1.6" stroke-linecap="round"/>
    <path class="shade" d="M116 214 L130 226 L144 214 L146 232 Q130 240 114 232 Z"/>
