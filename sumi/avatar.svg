      <circle cx="112.6" cy="115.2" r="1.6" fill="#fff"/>
      <circle cx="159.8" cy="113" r="1.7" fill="#fff"/>
      <path class="skin" d="M95 113 Q107 105 119 113 L119 100 L95 100 Z"/>
