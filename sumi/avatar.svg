        <path class="thin" d="M184 88 L196 88 L199 106 Q190 110 181 106 Z" fill="#e6bd64"/>
        <path d="M186 96 L185 104 M190 96 L190 106 M194 96 L195 104" stroke="#b48a38" stroke-width="1.6" stroke-linecap="round"/>
      </g>
    </g>

    <!-- brows: one flat, one raised in a smug arch -->
    <path class="ink nf" d="M94 102 Q106 97 120 102" stroke-width="6"/>
    <g class="brow"><path class="ink nf" d="M142 96 Q155 83 168 96" stroke-width="6"/></g>

    <!-- half-lidded, self-satisfied eyes -->
    <g transform="translate(0 4)"><g class="eyes">
      <ellipse class="thin" cx="107" cy="114" rx="10" ry="12" fill="#f6efdc" stroke-width="3.5"/>
      <ellipse class="thin" cx="154" cy="112" rx="10" ry="13" fill="#f6efdc" stroke-width="3.5"/>
